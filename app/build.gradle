plugins { id 'com.android.application' }
android {
    namespace 'cn.edu.njfu.timetable'
    compileSdk 37
    defaultConfig {
        applicationId 'cn.edu.njfu.timetable'
        minSdk 21
        targetSdk 37
        versionCode 5
        versionName '1.3.0'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs { debug { if (project.hasProperty('debugKeystore')) { storeFile file(project.property('debugKeystore')) } } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}

dependencies { implementation 'org.jsoup:jsoup:1.23.2'; coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5' }
